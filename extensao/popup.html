<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
body{width:300px;margin:0;padding:16px;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:#0E1320;color:#F4F0E9}
h1{font-size:16px;margin:0 0 4px;font-weight:600}p{color:#9AA1B2;margin:0 0 12px;font-size:12.5px}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9AA1B2;margin:10px 0 4px}
input{width:100%;box-sizing:border-box;background:#1B2336;border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:9px 10px;color:#F4F0E9}
button{margin-top:14px;width:100%;background:#E5B75F;border:0;border-radius:8px;padding:10px;font-weight:600;cursor:pointer;color:#0E1320}
#st{margin-top:10px;font-size:12.5px;min-height:1.2em}
</style></head><body>
<h1>Luméra CRM</h1>
<p>Cole a chave do <b>Webhook de entrada</b> (aba Integração do CRM, logado como agência).</p>
<label for="url">Endereço do CRM</label><input id="url" value="https://lumeraodonto.vercel.app">
<label for="key">Chave do webhook</label><input id="key" type="password" autocomplete="off">
<button id="save">Salvar e testar</button>
<div id="st"></div>
<script src="popup.js"></script>
</body></html>
